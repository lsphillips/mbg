name: Release

on:
  push:
    tags:
      - v*

jobs:

  build:
    uses: ./.github/workflows/build.yml

  release:

    needs: build

    runs-on: ubuntu-latest

    steps:

      - name: Fetch artifact
        uses: actions/download-artifact@v4
        with:
          name: build
          path: artifact/

      - name: Zip artifact
        working-directory: artifact/
        run: zip -r ../artifact.zip *

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create ${{ github.ref_name }} artifact.zip --title ${{ github.ref_name }} --verify-tag
