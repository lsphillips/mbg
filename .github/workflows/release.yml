name: Release

on:
  push:
    tags:
      - v*

jobs:

  build:
    uses: ./.github/workflows/build.yml

  release:

    name: Release

    needs:
      - build

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout
        uses: actions/checkout@v7

      - name: Fetch artifact
        uses: actions/download-artifact@v8
        with:
          name: build
          path: build/

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create ${{ github.ref_name }} build/* --title ${{ github.ref_name }} --verify-tag
